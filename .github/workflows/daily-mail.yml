name: english-mail

on:
  schedule:
    # UTC 23:00 = 北京时间次日 07:00
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # 也可以在网页上手动点运行

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send today's mail
        env:
          ENGLISH_MAIL_CONFIG: ${{ secrets.ENGLISH_MAIL_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "${ENGLISH_MAIL_CONFIG:-}" ]; then
            echo "::error::缺少 secret ENGLISH_MAIL_CONFIG"
            exit 1
          fi
          printf '%s' "$ENGLISH_MAIL_CONFIG" > english-mail.config.json
          python english-mail-reminder.py
          rm -f english-mail.config.json
